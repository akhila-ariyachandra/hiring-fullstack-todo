packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200 # 1 month

catalog:
  "@base-ui/react": ^1.9.0
  "@hono/node-server": ^2.1.3
  "@hookform/resolvers": ^6.0.2
  "@hono/zod-validator": ^0.9.1
  "@prisma/cli-engine": 0.9.0
  "@prisma/orm-mongo": 8.0.0-rc.21
  "@tailwindcss/turbopack": ^4.3.3
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  dotenv: ^17.4.2
  eslint: ^10.13.0
  eslint-config-next: ^16.4.3
  hono: ^4.13.14
  lucide-react: ^1.64.0
  mongodb: ^7.7.0
  next: ^16.4.3
  prisma: 8.0.0-rc.28
  prettier: ^3.9.10
  prettier-plugin-organize-imports: ^4.3.0
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-hook-form: ^7.91.0
  shadcn: ^4.23.0
  tailwindcss: ^4.3.3
  turbo: ^2.11.10
  tsx: ^4.23.0
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  knip: ^6.43.0
  zod: ^4.6.7
  server-only: 0.0.1
  nanoid: 6.0.2
  next-themes: ^0.4.6
  sonner: ^2.0.8

catalogMode: "strict"

catalogPrune: true
minimumReleaseAgeExclude:
  - "@types/node@26.6.6"
  - lucide-react@1.64.0
